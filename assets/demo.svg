<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="850" height="440">
  <defs>
    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes step1 { 0% { opacity: 0; } 5% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes step2 { 0%, 12% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes step3 { 0%, 28% { opacity: 0; } 34% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes step4 { 0%, 46% { opacity: 0; } 52% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes step5 { 0%, 64% { opacity: 0; } 70% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes step6 { 0%, 82% { opacity: 0; } 88% { opacity: 1; } 100% { opacity: 1; } }

      .terminal-bg { fill: #1e1e2e; rx: 8px; }
      .terminal-header { fill: #181825; }
      .dot-red { fill: #f38ba8; }
      .dot-yellow { fill: #f9e2af; }
      .dot-green { fill: #a6e3a1; }
      .text-title { fill: #cdd6f4; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
      .prompt { fill: #89b4fa; font-weight: bold; }
      .cmd { fill: #cdd6f4; }
      .comment { fill: #6c7086; font-style: italic; }
      .out-b1 { fill: #a6e3a1; }
      .out-b2 { fill: #f9e2af; }
      .out-b3 { fill: #89dceb; }
      .out-warn { fill: #f38ba8; font-weight: bold; }
      .cursor { fill: #f5e0dc; animation: blink 1s infinite; }

      .anim-1 { animation: step1 12s infinite; }
      .anim-2 { animation: step2 12s infinite; }
      .anim-3 { animation: step3 12s infinite; }
      .anim-4 { animation: step4 12s infinite; }
      .anim-5 { animation: step5 12s infinite; }
      .anim-6 { animation: step6 12s infinite; }

      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="850" height="440" class="terminal-bg" />

  <!-- Titlebar -->
  <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 842 0 C 846.42 0 850 3.58 850 8 L 850 32 L 0 32 Z" class="terminal-header" />
  <circle cx="20" cy="16" r="6" class="dot-red" />
  <circle cx="40" cy="16" r="6" class="dot-yellow" />
  <circle cx="60" cy="16" r="6" class="dot-green" />
  <text x="425" y="20" text-anchor="middle" class="text-title">l4-balancer &#8212; failover &amp; recovery demo</text>

  <!-- Terminal Content -->
  <g transform="translate(25, 60)">
    <!-- Section 1: Normal Round-Robin -->
    <g class="anim-1">
      <text x="0" y="0" class="comment"># 1. Round-robin rotation across healthy backends</text>
      <text x="0" y="20" class="prompt">$ <tspan class="cmd">for i in {1..3}; do curl -s http://127.0.0.1:8080/; done</tspan></text>
    </g>

    <g class="anim-2">
      <text x="0" y="44" class="out-b1">&gt; Response from Backend 1 (port 9001)</text>
      <text x="0" y="64" class="out-b2">&gt; Response from Backend 2 (port 9002)</text>
      <text x="0" y="84" class="out-b3">&gt; Response from Backend 3 (port 9003)</text>
    </g>

    <!-- Section 2: Failure Detection -->
    <g class="anim-3">
      <text x="0" y="120" class="comment"># 2. Terminate backend 2 &#8212; health checker trips after 2 failed probes</text>
      <text x="0" y="140" class="prompt">$ <tspan class="cmd">kill -9 $(lsof -t -i:9002)</tspan></text>
      <text x="0" y="164" class="out-warn">[WARN] Backend 127.0.0.1:9002 changed state to DEAD (active: 2/3)</text>
    </g>

    <g class="anim-4">
      <text x="0" y="200" class="comment"># 3. Dynamic failover: requests route only to surviving nodes</text>
      <text x="0" y="220" class="prompt">$ <tspan class="cmd">for i in {1..2}; do curl -s http://127.0.0.1:8080/; done</tspan></text>
      <text x="0" y="244" class="out-b1">&gt; Response from Backend 1 (port 9001)</text>
      <text x="0" y="264" class="out-b3">&gt; Response from Backend 3 (port 9003)</text>
    </g>

    <!-- Section 3: Recovery -->
    <g class="anim-5">
      <text x="0" y="300" class="comment"># 4. Revive backend 2 &#8212; auto-reinstated after 2 successful probes</text>
      <text x="0" y="320" class="prompt">$ <tspan class="cmd">python3 -m http.server 9002 &amp;</tspan></text>
      <text x="0" y="344" class="out-b2">[INFO] Backend 127.0.0.1:9002 changed state to HEALTHY (active: 3/3)</text>
    </g>

    <g class="anim-6">
      <text x="0" y="375" class="prompt">$ <tspan class="cmd">curl -s http://127.0.0.1:8080/</tspan></text>
      <text x="0" y="395" class="out-b2">&gt; Response from Backend 2 (port 9002) <tspan class="cursor">&#9608;</tspan></text>
    </g>
  </g>
</svg>
